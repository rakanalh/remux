name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [master]
    paths-ignore:
      - "site/**"
      - ".github/workflows/docs.yml"

env:
  CARGO_TERM_COLOR: always
  # rustc warnings (check, test, clippy) are errors.
  RUSTFLAGS: -D warnings
  # Cargo's own warnings too, such as an unused dependency in Cargo.toml,
  # which RUSTFLAGS cannot reach because rustc never emits them.
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
