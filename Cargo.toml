[package]
name = "remux"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
# `default-features = false` turns OFF vte's `no_std` feature (which is ON by
# default). With it on, the parser's OSC buffer is a fixed `ArrayVec<u8, 1024>`
# and any OSC payload past 1 KiB is silently truncated — which would hand a
# mangled fragment to `OSC 52` clipboard writes and to long OSC 8 URIs. Off, the
# buffer is a `Vec` that holds the whole sequence. Removes the arrayvec dep and
# adds none.
vte = { version = "0.13", default-features = false }
nix = { version = "0.29", features = ["term", "signal", "process", "fs"] }
libc = "0.2"
tokio = { version = "1", features = ["full"] }
interprocess = { version = "2.2", features = ["tokio"] }
crossbeam = "0.8"
cassowary = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
daemonize = "0.5"
unicode-width = "0.2"
anyhow = "1"
thiserror = "2"
dirs = "6"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
base64 = "0.22"
notify = "7"
# Agent-state patterns are CONFIG, not code (see `config::agents`), which needs a
# pattern language at runtime. Already in the lock file via `env_logger`, so
# promoting it to a direct dependency adds no new crate to the build.
regex = "1"

# macOS has no /proc, so we read a foreign process's cwd via sysinfo. Scoped to
# macOS targets only so Linux builds don't pull it in.
[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
